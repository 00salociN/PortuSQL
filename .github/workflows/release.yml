name: Release

# O workflow apenas GERA os artefatos (.jar e .msi).
# A publicacao da release no GitHub e manual (ver .github/release-notes/).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao a empacotar (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    name: Build do executavel .jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar
        run: ./mvnw -B -ntp clean package

      - name: Verificar o artefato
        run: |
          set -euo pipefail
          unzip -p target/PortuSQL-*.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: PortuSQL.PortuSQL.App'
          unzip -l target/PortuSQL-*.jar | grep -q 'org/h2/Driver.class'
          echo "Manifest e H2 embarcado: OK"

      - name: Preparar o executavel
        run: cp target/PortuSQL-*.jar target/PortuSQL.jar

      - name: Publicar o artefato .jar
        uses: actions/upload-artifact@v4
        with:
          name: PortuSQL.jar
          path: target/PortuSQL.jar
          if-no-files-found: error
          retention-days: 30

  msi:
    name: Build do instalador .msi
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Baixar o executavel ja compilado
        uses: actions/download-artifact@v4
        with:
          name: PortuSQL.jar

      - name: Ler a versao do projeto
        id: meta
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pom.xml)).project.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Versao: $version"

      - name: Instalar WiX 3.x (necessario para o jpackage gerar .msi)
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.14.0 -y --allow-downgrade --force --no-progress
          $candle = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw 'WiX Toolset 3.x nao encontrado apos a instalacao' }
          $candle.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX em: $($candle.Directory.FullName)"

      - name: Montar o runtime com jlink
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pom.xml)).project.version
          Write-Host "Versao do projeto: $version"
          jlink `
            --add-modules java.base,java.desktop,java.sql,java.logging `
            --strip-debug --no-header-files --no-man-pages --compress=2 `
            --output runtime
          Write-Host ("Runtime: {0} MB" -f [math]::Round((Get-ChildItem runtime -Recurse | Measure-Object Length -Sum).Sum / 1MB))

      - name: Gerar o instalador .msi
        shell: pwsh
        run: |
          $version = ([xml](Get-Content pom.xml)).project.version
          New-Item -ItemType Directory -Force -Path app | Out-Null
          Copy-Item PortuSQL.jar app/PortuSQL.jar
          jpackage `
            --type msi `
            --name PortuSQL `
            --app-version $version `
            --vendor 'Nicolas Gabriel Venancio dos Santos' `
            --description 'PortuSQL - SQL em portugues para o ensino de bancos de dados' `
            --input app `
            --main-jar PortuSQL.jar `
            --main-class PortuSQL.PortuSQL.App `
            --runtime-image runtime `
            --icon src/main/resources/portusql.ico `
            --dest target/installer `
            --win-menu `
            --win-menu-group PortuSQL `
            --win-shortcut `
            --win-per-user-install `
            --win-upgrade-uuid '8f3b1c62-4a7d-4e29-9b6c-2d5a7e91f0c4'

      - name: Publicar o artefato .msi
        uses: actions/upload-artifact@v4
        with:
          name: PortuSQL-${{ steps.meta.outputs.version }}.msi
          path: target/installer/*.msi
          if-no-files-found: error
          retention-days: 30
